name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Windows dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Check Python and PowerShell syntax
        shell: pwsh
        run: |
          python -m compileall -q windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $errorsFound = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errorsFound) | Out-Null
            if ($errorsFound) { throw ($errorsFound | Out-String) }
          }
      - name: Check voice libraries
        run: python -c "import tkinter, pygame, pystray, PIL, pycaw, edge_tts, piper"
      - name: Run tests
        run: python -m unittest discover -s tests -v
